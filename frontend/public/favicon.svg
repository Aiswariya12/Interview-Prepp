<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#312E81" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Inner border glow -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Graduation Cap Icon -->
  <g filter="url(#shadow)">
    <!-- Cap Rhombus Diamond Top -->
    <path d="M32 16 L53 26.5 L32 37 L11 26.5 Z" fill="#FFFFFF" />
    
    <!-- Skull Cap Underside -->
    <path d="M19 31.5 V41 C19 45.5 25 48.5 32 48.5 C39 48.5 45 45.5 45 41 V31.5 L32 38 Z" fill="#EEF2FF" />
    
    <!-- Cap Top Center Button -->
    <ellipse cx="32" cy="26.5" rx="2" ry="1.2" fill="#E0E7FF" />

    <!-- Tassel Ribbon & Bob -->
    <path d="M32 26.5 Q45 27.5 48 34" stroke="url(#tasselGrad)" stroke-width="2.4" stroke-linecap="round" fill="none" />
    <polygon points="46.5,34 49.5,34 50.5,43 45.5,43" fill="url(#tasselGrad)" />
    <circle cx="48" cy="34" r="1.5" fill="#FDE68A" />
  </g>
</svg>